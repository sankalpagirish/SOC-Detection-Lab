title: SSH Brute Force Attack Detected
id: 8c1d1c88-ssh-bruteforce
status: experimental
description: Detects multiple failed SSH login attempts indicating brute-force behavior
author: Sanku
logsource:
  product: linux
  service: auth
detection:
  selection:
    message|contains: "Failed password"
  timeframe: 5m
  condition: selection | count() > 5
level: high
tags:
  - attack.t1110
